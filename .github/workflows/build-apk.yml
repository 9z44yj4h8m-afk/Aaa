name: Build ALMOGHANI LIVE APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare Android project from this website
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html || { echo "Missing index.html at root"; exit 1; }
          cat > 'settings.gradle' <<'ALMOGHANI_SETTINGS_GRADLE_END'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'ALMOGHANI_LIVE'
          include ':app'
          ALMOGHANI_SETTINGS_GRADLE_END
          cat > 'build.gradle' <<'ALMOGHANI_BUILD_GRADLE_END'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          ALMOGHANI_BUILD_GRADLE_END
          cat > 'gradle.properties' <<'ALMOGHANI_GRADLE_PROPERTIES_END'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          ALMOGHANI_GRADLE_PROPERTIES_END
          mkdir -p app
          cat > 'app/build.gradle' <<'ALMOGHANI_APP_BUILD_GRADLE_END'
          plugins {
              id 'com.android.application'
          }
          
          android {
              namespace 'net.almoghani.live'
              compileSdk 35
          
              defaultConfig {
                  applicationId 'net.almoghani.live'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
              }
          
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          
          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          ALMOGHANI_APP_BUILD_GRADLE_END
          mkdir -p app/src/main
          cat > 'app/src/main/AndroidManifest.xml' <<'ALMOGHANI_APP_SRC_MAIN_ANDROIDMANIFEST_XML_END'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false"
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ALMOGHANI_APP_SRC_MAIN_ANDROIDMANIFEST_XML_END
          mkdir -p app/src/main/res/values
          cat > 'app/src/main/res/values/strings.xml' <<'ALMOGHANI_APP_SRC_MAIN_RES_VALUES_STRINGS_XML_END'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <string name="app_name">ALMOGHANI LIVE</string>
          </resources>
          ALMOGHANI_APP_SRC_MAIN_RES_VALUES_STRINGS_XML_END
          mkdir -p app/src/main/res/drawable
          cat > 'app/src/main/res/drawable/ic_launcher.xml' <<'ALMOGHANI_APP_SRC_MAIN_RES_DRAWABLE_IC_LAUNCHER_XML_END'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#09111D" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#142F45" android:pathData="M11,24Q11,14 22,14L86,14Q97,14 97,24L97,80Q97,91 86,91L22,91Q11,91 11,80Z"/>
              <path android:strokeWidth="3.5" android:strokeColor="#37E4ED" android:fillColor="#00000000" android:pathData="M18,29 L18,76 Q18,84 26,84 L82,84 Q90,84 90,76 L90,29 Q90,21 82,21 L26,21 Q18,21 18,29 Z"/>
              <path android:fillColor="#D9B981" android:pathData="M43,34 L43,72 L74,53 Z"/>
              <path android:fillColor="#37E4ED" android:pathData="M38,94h32v5h-32z"/>
          </vector>
          ALMOGHANI_APP_SRC_MAIN_RES_DRAWABLE_IC_LAUNCHER_XML_END
          mkdir -p app/src/main/java/net/almoghani/live
          cat > 'app/src/main/java/net/almoghani/live/MainActivity.java' <<'ALMOGHANI_APP_SRC_MAIN_JAVA_NET_ALMOGHANI_LIVE_MAINACTIVITY_JAVA_END'
          package net.almoghani.live;
          
          import android.app.Activity;
          import android.app.DownloadManager;
          import android.content.ClipData;
          import android.content.Intent;
          import android.content.ActivityNotFoundException;
          import android.content.res.Configuration;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.util.Base64;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.Toast;
          
          import androidx.webkit.WebViewAssetLoader;
          
          import java.io.OutputStream;
          import java.util.ArrayList;
          
          public final class MainActivity extends Activity {
              private static final String HOME = "https://appassets.androidplatform.net/assets/index.html";
              private static final int REQUEST_PICK_FILES = 401;
              private static final int REQUEST_SAVE_DOCUMENT = 402;
              private WebView webView;
              private FrameLayout root;
              private View fullscreenView;
              private WebChromeClient.CustomViewCallback fullscreenCallback;
              private android.webkit.ValueCallback<Uri[]> pendingFileCallback;
              private String pendingSaveData;
              private String pendingSaveName;
              private String pendingSaveMime;
              private WebViewAssetLoader assetLoader;
          
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().setStatusBarColor(Color.rgb(9, 12, 20));
                  getWindow().setNavigationBarColor(Color.rgb(9, 12, 20));
                  assetLoader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();
          
                  root = new FrameLayout(this);
                  webView = new WebView(this);
                  root.addView(webView, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  setContentView(root);
          
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(false);
                  settings.setSupportMultipleWindows(false);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  settings.setSafeBrowsingEnabled(true);
                  webView.setBackgroundColor(Color.rgb(9, 12, 20));
                  webView.addJavascriptInterface(new AndroidDownloads(), "AlmoghaniNative");
          
                  webView.setWebViewClient(new WebViewClient() {
                      @Override public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return assetLoader.shouldInterceptRequest(request.getUrl());
                      }
                      @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          if (!request.isForMainFrame()) return false;
                          if ("appassets.androidplatform.net".equalsIgnoreCase(uri.getHost()) &&
                              "https".equalsIgnoreCase(uri.getScheme())) return false;
                          if ("http".equalsIgnoreCase(uri.getScheme()) || "https".equalsIgnoreCase(uri.getScheme())) {
                              try { startActivity(new Intent(Intent.ACTION_VIEW, uri)); }
                              catch (ActivityNotFoundException ignored) { Toast.makeText(MainActivity.this, "لا يوجد تطبيق لفتح الرابط", Toast.LENGTH_SHORT).show(); }
                          }
                          return true;
                      }
                      @Override public void onPageFinished(WebView view, String url) {
                          if (HOME.equals(url)) installNativeDownloadHandler();
                      }
                  });
          
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override public boolean onShowFileChooser(WebView view,
                              android.webkit.ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (pendingFileCallback != null) pendingFileCallback.onReceiveValue(null);
                          pendingFileCallback = callback;
                          Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("*/*"); // .m3u/.m3u8/.json/.csv/.txt/.zip and other playlist formats
                          intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE,
                                  params.getMode() == FileChooserParams.MODE_OPEN_MULTIPLE);
                          intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                          try { startActivityForResult(intent, REQUEST_PICK_FILES); }
                          catch (ActivityNotFoundException error) {
                              pendingFileCallback.onReceiveValue(null);
                              pendingFileCallback = null;
                              Toast.makeText(MainActivity.this, "لا يوجد مدير ملفات", Toast.LENGTH_SHORT).show();
                          }
                          return true;
                      }
                      @Override public void onShowCustomView(View view, CustomViewCallback callback) {
                          if (fullscreenView != null) { callback.onCustomViewHidden(); return; }
                          fullscreenView = view;
                          fullscreenCallback = callback;
                          webView.setVisibility(View.GONE);
                          root.addView(view, new FrameLayout.LayoutParams(-1, -1));
                          getWindow().addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN |
                                  WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                      }
                      @Override public void onHideCustomView() { leaveFullscreen(); }
                  });
          
                  // Remote links are handled by Android's normal browser; local generated files
                  // (blob:) are handled securely by the download bridge below.
                  webView.setDownloadListener((url, ua, disposition, mimeType, length) -> {
                      if (url.startsWith("https://") || url.startsWith("http://")) {
                          try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url))); }
                          catch (Exception ignored) { Toast.makeText(this, "تعذر فتح الرابط", Toast.LENGTH_SHORT).show(); }
                      }
                  });
          
                  webView.loadUrl(HOME);
              }
          
              private void leaveFullscreen() {
                  if (fullscreenView == null) return;
                  root.removeView(fullscreenView);
                  fullscreenView = null;
                  webView.setVisibility(View.VISIBLE);
                  getWindow().clearFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN |
                          WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  if (fullscreenCallback != null) fullscreenCallback.onCustomViewHidden();
                  fullscreenCallback = null;
              }
          
              // Capture programmatic <a download> clicks made by the site when it exports
              // M3U/JSON/ZIP. Android WebView can't download blob: URLs by itself.
              private void installNativeDownloadHandler() {
                  String js = "(function(){" +
                    "if(window.__almoghaniDownloadsInstalled)return;window.__almoghaniDownloadsInstalled=true;" +
                    "document.addEventListener('click',function(e){" +
                    "var el=e.target;var a=(el&&el.closest)?el.closest('a[download]'):null;" +
                    "if(!a||!a.href||!a.href.startsWith('blob:'))return;" +
                    "e.preventDefault();e.stopImmediatePropagation();" +
                    "fetch(a.href).then(function(r){return r.blob()}).then(function(b){" +
                    "var rd=new FileReader();rd.onload=function(){" +
                    "var result=String(rd.result||'');var idx=result.indexOf(',');" +
                    "if(idx>=0)AlmoghaniNative.saveFile(a.download||'channels.m3u',b.type||'application/octet-stream',result.slice(idx+1));" +
                    "};rd.readAsDataURL(b);" +
                    "}).catch(function(){AlmoghaniNative.showMessage('تعذر تجهيز الملف');});" +
                    "},true);" +
                    "})();";
                  webView.evaluateJavascript(js, null);
              }
          
              private final class AndroidDownloads {
                  @JavascriptInterface public void saveFile(String name, String mime, String base64) {
                      runOnUiThread(() -> {
                          if (pendingSaveData != null) {
                              Toast.makeText(MainActivity.this, "احفظ الملف السابق أولًا", Toast.LENGTH_SHORT).show();
                              return;
                          }
                          // A generous limit protects the app from accidental huge JS bridge payloads.
                          if (base64.length() > 45 * 1024 * 1024) {
                              Toast.makeText(MainActivity.this, "الملف كبير جدًا للتصدير المباشر", Toast.LENGTH_LONG).show();
                              return;
                          }
                          pendingSaveData = base64;
                          pendingSaveName = name.replace("/", "_").replace("\\", "_");
                          pendingSaveMime = (mime == null || mime.isEmpty()) ? "application/octet-stream" : mime.split(";")[0];
                          Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType(pendingSaveMime);
                          intent.putExtra(Intent.EXTRA_TITLE, pendingSaveName);
                          try { startActivityForResult(intent, REQUEST_SAVE_DOCUMENT); }
                          catch (Exception e) {
                              pendingSaveData = null;
                              Toast.makeText(MainActivity.this, "تعذر فتح حفظ الملفات", Toast.LENGTH_LONG).show();
                          }
                      });
                  }
                  @JavascriptInterface public void showMessage(String message) {
                      runOnUiThread(() -> Toast.makeText(MainActivity.this, message, Toast.LENGTH_SHORT).show());
                  }
              }
          
              @Override protected void onActivityResult(int request, int result, Intent data) {
                  super.onActivityResult(request, result, data);
                  if (request == REQUEST_PICK_FILES) {
                      if (pendingFileCallback == null) return;
                      ArrayList<Uri> uris = new ArrayList<>();
                      if (result == RESULT_OK && data != null) {
                          ClipData clip = data.getClipData();
                          if (clip != null) for (int i=0;i<clip.getItemCount();i++)
                              uris.add(clip.getItemAt(i).getUri());
                          else if (data.getData() != null) uris.add(data.getData());
                      }
                      pendingFileCallback.onReceiveValue(uris.isEmpty()?null:uris.toArray(new Uri[0]));
                      pendingFileCallback = null;
                  } else if (request == REQUEST_SAVE_DOCUMENT) {
                      if (result == RESULT_OK && data != null && data.getData() != null && pendingSaveData != null) {
                          try (OutputStream stream = getContentResolver().openOutputStream(data.getData())) {
                              if (stream == null) throw new Exception("No output stream");
                              stream.write(Base64.decode(pendingSaveData, Base64.DEFAULT));
                              Toast.makeText(this, "تم حفظ " + pendingSaveName, Toast.LENGTH_LONG).show();
                          } catch (Exception e) {
                              Toast.makeText(this, "فشل الحفظ: " + e.getMessage(), Toast.LENGTH_LONG).show();
                          }
                      }
                      pendingSaveData = null;
                      pendingSaveName = null;
                      pendingSaveMime = null;
                  }
              }
          
              @Override public void onBackPressed() {
                  if (fullscreenView != null) { leaveFullscreen(); return; }
                  if (webView.canGoBack()) { webView.goBack(); return; }
                  super.onBackPressed();
              }
          
              @Override protected void onDestroy() {
                  if (pendingFileCallback != null) pendingFileCallback.onReceiveValue(null);
                  if (webView != null) {
                      webView.loadUrl("about:blank");
                      root.removeView(webView);
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          ALMOGHANI_APP_SRC_MAIN_JAVA_NET_ALMOGHANI_LIVE_MAINACTIVITY_JAVA_END
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
          echo "Android source generated from existing index.html"
      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ALMOGHANI-LIVE.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ALMOGHANI-LIVE-APK
          path: ALMOGHANI-LIVE.apk
          if-no-files-found: error